version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: secure-guard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: secure_guard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - secure-guard-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secure-guard-backend
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
      - PORT=3333
      - HOST=0.0.0.0
      - APP_KEY=supersecretappkeythatshouldbechanged1234
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_DATABASE=secure_guard
    depends_on:
      - postgres
    networks:
      - secure-guard-network
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: secure-guard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3333
    networks:
      - secure-guard-network
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: secure-guard-zap
    command: zap-api-scan.py -t http://backend:3333 -f openapi -r zap-report.html
    volumes:
      - ./zap-reports:/zap/wrk/:rw
    depends_on:
      - backend
    networks:
      - secure-guard-network
    profiles:
      - security

volumes:
  postgres_data:

networks:
  secure-guard-network:
    driver: bridge
